<!DOCTYPE html>
<html lang="kr" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
    <title>list</title>
    <style>
        html,
        body {
            height: 100%;
        }

        .table-in {
            max-width: 800px;
            padding: 1rem;
        }

        .table {
            padding: 50px;
        }

        th, td {
            padding-top: 10px;
            padding-bottom: 20px;
            padding-left: 30px;
            padding-right: 40px;
        }

    </style>
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
<div class="table-in w-100 m-auto">
    <table class="table">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">memberEmail</th>
            <th scope="col">memberPassword</th>
            <th scope="col">memberName</th>
            <th scope="col">상세조회</th>
            <th scope="col">삭제</th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
        <tr th:each="member:${memberList}">
            <td th:text="${member.id}"></td>
            <td th:text="${member.memberEmail}"></td>
            <td th:text="${member.memberPassword}"></td>
            <td th:text="${member.memberName}"></td>
            <!-- query String /member?id=1
                rest api /member/1      -->
            <td>
                <a th:href="@{|/member/${member.id}|}">조회</a>
            </td>
            <td>
                <a th:href="@{|/member/delete/${member.id}|}">삭제</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</class=>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
